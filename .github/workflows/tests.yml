name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-tests:
    name: Go tests (TUI + units)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test -json ./internal/... ./test/internal/... ./test/npx/... 2>&1 | tee go-test-output.json
        continue-on-error: true

      # Names every failing test, replays its output, annotates the source line,
      # and fails the job. Without it a failure reads only "exit code 1".
      - name: Report Go test results
        if: always()
        run: go run ./cmd/ci-report --title "Go tests (TUI + units)" go-test-output.json

  bash-tests:
    name: Bash tests (shell libs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install CI dependencies
        run: brew install coreutils

      - name: Run bash integration tests
        run: go test -json ./test/bash/... 2>&1 | tee bash-test-output.json
        continue-on-error: true

      - name: Report bash test results
        if: always()
        run: go run ./cmd/ci-report --title "Bash tests (shell libs)" bash-test-output.json
